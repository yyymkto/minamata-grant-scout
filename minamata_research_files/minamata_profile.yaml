      as_of: "2020-10-01"
      source: 令和2年国勢調査 / 水俣市過疎地域持続的発展計画(R8-R12)
      confidence: high
    - value: null
      definition: 国勢調査人口（2025速報）
      as_of: "2025-10-01"
      source: 熊本県「令和7年国勢調査 熊本県人口（速報値）」第1表Excel
      confidence: null
