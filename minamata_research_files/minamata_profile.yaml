  natural_change_2023: {births: 79, deaths: 416, net: -337, source: 第2期水俣市まち・ひと・しごと創生推進計画, confidence: high}
  social_change_2023: {in: 532, out: 771, net: -239, source: 第2期水俣市まち・ひと・しごと創生推進計画, confidence: high}
  fiscal_capability_index:
    value: 0.39
    as_of: FY2020
    source: 水俣市過疎地域持続的発展計画(R8-R12)
