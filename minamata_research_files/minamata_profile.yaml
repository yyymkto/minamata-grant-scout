# =====================================================================
# MINAMATA_PROFILE  —  水俣市 補助金マッチング用 地域プロファイル
# ---------------------------------------------------------------------
# 作成日        : 2026-09-11
# スキーマ版    : 1.0
# 原則          : 数値にはすべて source / as_of / confidence を付ける。
#                 不明な値は null とし、推測値で埋めない。
# confidence    : high = 一次資料で確認
#                 medium = 二次資料経由・年次が古い・解釈を含む
#                 low = 推論中心
# =====================================================================

meta:
  municipality: 熊本県水俣市
  municipality_code: "43205"
  profile_version: "1.0"
  as_of: "2026-09-11"
  next_review: "2026-10-15"   # 2025国勢調査 確定人口の反映後

# ---------------------------------------------------------------------
# 1. 基本指標
# ---------------------------------------------------------------------
basic_indicators:
  population:
