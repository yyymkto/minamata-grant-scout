    overall_1st: health_social_work
    secondary_order: [construction, chemicals, other_manufacturing]
    tertiary_order: [health_social_work, housing_rental, public_service]
    net_exporters: [electrical_machinery, other_manufacturing, health_social_work]
  exclude_from_scoring: [housing_rental, public_service]   # 帰属家賃・公務は補助対象外
