    confidence: high
  forest_ratio:
    value: 0.738
    as_of: FY2023
    note: 林野12,055ha / 総面積16,329ha、民有林人工林率85.8%
    source: 水俣市過疎地域持続的発展計画(R8-R12)
    confidence: high

# ---------------------------------------------------------------------
# 2. 産業構造の根拠データ
# ---------------------------------------------------------------------
employment_2020:           # 国勢調査・常住地ベース、総数10,353人
  source: 令和2年国勢調査（GD Freak!経由、合計値は市過疎計画と一致）
  confidence: high
  total: 10353
  national_share_reference:   # 全国構成比（令和2年国勢調査）
    medical_welfare: 0.135
    manufacturing: 0.159
    wholesale_retail: 0.158
  by_industry:
    medical_welfare:    {workers: 2563, share: 0.248}
    manufacturing:      {workers: 1571, share: 0.152}
    wholesale_retail:   {workers: 1438, share: 0.139}
    construction:       {workers: 748,  share: 0.072}
    services_other:     {workers: 696,  share: 0.067}
    agriculture_forestry: {workers: 570, share: 0.055, note: 林業単独は不明}
    public_service:     {workers: 480,  share: 0.046}
    education:          {workers: 466,  share: 0.045}
    accommodation_food: {workers: 447,  share: 0.043}
    living_services:    {workers: 346,  share: 0.033}
    transport:          {workers: 292,  share: 0.028}
    fisheries:          {workers: 35,   share: 0.003}

value_added_2018:          # 環境省 地域経済循環分析
  source: 環境省 地域経済循環分析（2018年データ）
  confidence: medium       # 1位は high、2位以下は順位のみ
  grp_total_oku_yen: 811
  energy_outflow_oku_yen: 59
